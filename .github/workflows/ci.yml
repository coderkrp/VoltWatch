name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx
          
      - name: Lint with Ruff
        working-directory: ./backend
        run: |
          ruff check .
          
      - name: Run Tests
        working-directory: ./backend
        run: |
          pytest -v

  dashboard-test:
    name: Dashboard Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'
          
      - name: Install dependencies
        working-directory: ./dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          
      - name: Lint with Ruff
        working-directory: ./dashboard
        run: |
          ruff check .
          
      - name: Run Tests
        working-directory: ./dashboard
        run: |
          pytest -v

  firmware-build:
    name: Firmware Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH
          
      - name: Setup ESP8266 Core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          
      - name: Install Libraries
        run: |
          arduino-cli lib install "Adafruit INA219"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "RTClib"
          arduino-cli lib install "ArduinoJson"
          
      - name: Compile Firmware
        working-directory: ./esp-ina219-datalogger
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 esp-ina219-datalogger.ino
